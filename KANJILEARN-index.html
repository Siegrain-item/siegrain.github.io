<script>
function kanaToRomaji(str){
  if(!str||str==='—')return'';
  const k2h=c=>String.fromCharCode(c.charCodeAt(0)-0x60);
  let s=str.replace(/[\u30a1-\u30f6]/g,k2h);
  s=s.replace(/[、。！？]/g,'');
  const m={'きゃ':'kya','きゅ':'kyu','きょ':'kyo','しゃ':'sha','しゅ':'shu','しょ':'sho',
    'ちゃ':'cha','ちゅ':'chu','ちょ':'cho','にゃ':'nya','にゅ':'nyu','にょ':'nyo',
    'ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo','みゃ':'mya','みゅ':'myu','みょ':'myo',
    'りゃ':'rya','りゅ':'ryu','りょ':'ryo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo',
    'じゃ':'ja','じゅ':'ju','じょ':'jo','びゃ':'bya','びゅ':'byu','びょ':'byo',
    'ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo',
    'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
    'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','さ':'sa','し':'shi','す':'su','せ':'se','そ':'so',
    'ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
    'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no',
    'は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
    'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po','ま':'ma','み':'mi','む':'mu','め':'me','も':'mo',
    'や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro',
    'わ':'wa','を':'o','ん':'n','ー':'','　':' ',' ':' '};
  const keys=Object.keys(m).sort((a,b)=>b.length-a.length);
  let out='',i=0,double=false;
  while(i<s.length){
    if(s[i]==='っ'){double=true;i++;continue}
    let hit=false;
    for(const k of keys){if(s.substr(i,k.length)===k){
      let r=m[k];if(double&&/^[a-z]/.test(r))r=r[0]+r;
      double=false;out+=r;i+=k.length;hit=true;break}}
    if(!hit){out+=s[i];i++}}
  return out;
}
</script>

KANJI.forEach(k=>{if(SEEN.has(k[0]))return;SEEN.add(k[0]);
POOL.push({id:POOL.length,k:k[0],m:k[1],on:k[2],kun:k[3],lv:k[4],vocab:k[5]||[]})});

const KEY='kanji-dojo-v9';
const DEFAULT_CFG={source:'kanji',count:20,type:'mixed',pool:'all',timer:0};
let store={progress:{},stats:{right:0,wrong:0},quizConfig:Object.assign({},DEFAULT_CFG)};
try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);
store.progress=d.progress||{};store.stats=d.stats||{right:0,wrong:0};
if(d.quizConfig)Object.assign(store.quizConfig,d.quizConfig)}}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function prog(k){return store.progress[k]||(store.progress[k]={box:0,right:0,wrong:0})}
function boxOf(k){return store.progress[k]?store.progress[k].box:0}
function bump(k,ok){const p=prog(k);
if(ok){p.box=Math.min(p.box+1,5);p.right++;store.stats.right++}
else{p.box=0;p.wrong++;store.stats.wrong++}persist()}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pool=()=>POOL.filter(c=>S.level==='ALL'||c.lv===S.level);

const S={level:'N5',mode:'cards',queue:[],idx:0,flipped:false,quiz:null,
quizConfig:store.quizConfig,dictSearch:'',dictCat:'ALL'};
function saveConfig(){store.quizConfig=S.quizConfig;persist()}

function newDeck(){const p=shuffle(pool());
p.sort((a,b)=>boxOf(a.k)-boxOf(b.k));
S.queue=p.slice(0,20);S.idx=0;S.flipped=false}

function answer(ok){if(S.idx>=S.queue.length)return;
bump(S.queue[S.idx].k,ok);S.idx++;S.flipped=false;renderCards();renderStats()}

/* ===== QUIZ POOL: multi-source ===== */
function levelMatch(lv){
  if(S.level==='ALL')return true;
  if(S.level==='LIFE')return lv==='N5'||lv==='LIFE';
  return lv===S.level;
}
function getQuizPool(){
  const cfg=S.quizConfig;const src=cfg.source||'kanji';
  if(src==='vocab'){
    let base=VOCAB.filter(v=>levelMatch(v.lv));
    switch(cfg.pool){
      case'weak':return base.filter(v=>boxOf('v:'+v.w)<3);
      case'new':return base.filter(v=>!store.progress['v:'+v.w]);
      case'mastered':return base.filter(v=>boxOf('v:'+v.w)>=4);
      default:return base;
    }
  }
  if(src==='bunpou'){
    let base=BUNPOU.filter(b=>levelMatch(b.lv));
    switch(cfg.pool){
      case'weak':return base.filter(b=>boxOf('b:'+b.p)<3);
      case'new':return base.filter(b=>!store.progress['b:'+b.p]);
      case'mastered':return base.filter(b=>boxOf('b:'+b.p)>=4);
      default:return base;
    }
  }
  let base=pool();
  if(cfg.type==='vocab')base=base.filter(c=>c.vocab.length>0);
  switch(cfg.pool){
    case'weak':return base.filter(c=>boxOf(c.k)<3);
    case'new':return base.filter(c=>!store.progress[c.k]);
    case'mastered':return base.filter(c=>boxOf(c.k)>=4);
    default:return base;
  }
}
function poolCounts(){
  const cfg=S.quizConfig;const src=cfg.source||'kanji';
  if(src==='vocab'){
    const base=VOCAB.filter(v=>levelMatch(v.lv));return{
      all:base.length,
      weak:base.filter(v=>boxOf('v:'+v.w)<3).length,
      new:base.filter(v=>!store.progress['v:'+v.w]).length,
      mastered:base.filter(v=>boxOf('v:'+v.w)>=4).length};
  }
  if(src==='bunpou'){
    const base=BUNPOU.filter(b=>levelMatch(b.lv));return{
      all:base.length,
      weak:base.filter(b=>boxOf('b:'+b.p)<3).length,
      new:base.filter(b=>!store.progress['b:'+b.p]).length,
      mastered:base.filter(b=>boxOf('b:'+b.p)>=4).length};
  }
  const base=pool();return{
    all:base.length,
    weak:base.filter(c=>boxOf(c.k)<3).length,
    new:base.filter(c=>!store.progress[c.k]).length,
    mastered:base.filter(c=>boxOf(c.k)>=4).length};
}

/* ===== KANJI QUESTION ===== */
function makeKanjiQuestion(card,type){
const others=shuffle(POOL.filter(x=>x.k!==card.k));
if(type==='kanji2mean'){
const d=others.filter(o=>o.m!==card.m).slice(0,3);
if(d.length<3)return makeKanjiQuestion(card,'mean2kanji');
return{key:card.k,card,type,
prompt:`<div class="q-label">What does this kanji mean?</div>
<div class="q-kanji jp">${card.k}</div>`,
opts:shuffle([{label:card.m,correct:true},
...d.map(o=>({label:o.m,correct:false}))])}}
if(type==='mean2kanji'){
const d=others.filter(o=>o.m!==card.m).slice(0,3);
if(d.length<3)return makeKanjiQuestion(card,'kanji2mean');
return{key:card.k,card,type,
prompt:`<div class="q-label">Which kanji means…</div>
<div class="q-text">${card.m}</div>`,
opts:shuffle([{label:`<span class="jp opt-k">${card.k}</span>`,correct:true},
...d.map(o=>({label:`<span class="jp opt-k">${o.k}</span>`,correct:false}))])}}
if(type==='reading'){
const readings=[card.on,card.kun].filter(r=>r&&r!=='—');
if(!readings.length)return makeKanjiQuestion(card,'kanji2mean');
const ans=readings[Math.floor(Math.random()*readings.length)];
const seen=new Set(readings);const distract=[];
for(const o of others){
const rs=[o.on,o.kun].filter(r=>r&&r!=='—');
for(const r of rs){if(!seen.has(r)){seen.add(r);distract.push(r);break}}
if(distract.length>=3)break}
if(distract.length<3)return makeKanjiQuestion(card,'kanji2mean');
return{key:card.k,card,type,
prompt:`<div class="q-label">Which is a reading of this kanji?</div>
<div class="q-kanji jp">${card.k}</div>`,
opts:shuffle([{label:ans+' <span class="romaji">'+kanaToRomaji(ans)+'</span>',correct:true},
...distract.map(d=>({label:d+' <span class="romaji">'+kanaToRomaji(d)+'</span>',correct:false}))])}}
if(type==='vocab'){
if(!card.vocab.length)return makeKanjiQuestion(card,'kanji2mean');
const v=card.vocab[Math.floor(Math.random()*card.vocab.length)];
const distPool=[];
for(const o of others){
for(const ov of o.vocab){
if(ov[2]!==v[2]&&!distPool.find(x=>x[2]===ov[2]))distPool.push(ov);
if(distPool.length>=3)break}
if(distPool.length>=3)break}
if(distPool.length<3)return makeKanjiQuestion(card,'kanji2mean');
return{key:card.k,card,type,
prompt:`<div class="q-label">What does this word mean?</div>
<div class="q-word jp">${v[0]}</div>
<div class="q-sub">${v[1]} · ${kanaToRomaji(v[1])}</div>`,
opts:shuffle([{label:v[2],correct:true},
...distPool.map(d=>({label:d[2],correct:false}))])}}
return makeKanjiQuestion(card,'kanji2mean')}

/* ===== VOCAB QUESTION ===== */
function makeVocabQuestion(v,type){
  const others=shuffle(VOCAB.filter(x=>x.w!==v.w));
  if(type==='mixed'){const c=['w2m','m2w','r2w','w2r'];type=c[Math.floor(Math.random()*4)]}
  if(type==='w2m'){
    const d=others.filter(o=>o.m!==v.m).slice(0,3);
    if(d.length<3)return makeVocabQuestion(v,'m2w');
    return{key:'v:'+v.w,card:v,type,
      prompt:`<div class="q-label">Apa arti kata ini?</div>
<div class="q-word jp">${v.w}</div>
<div class="q-sub">${v.k} · ${v.r}</div>`,
      opts:shuffle([{label:v.m,correct:true},
        ...d.map(o=>({label:o.m,correct:false}))])};
  }
  if(type==='m2w'){
    const d=others.filter(o=>o.m!==v.m).slice(0,3);
    if(d.length<3)return makeVocabQuestion(v,'w2m');
    return{key:'v:'+v.w,card:v,type,
      prompt:`<div class="q-label">Kata mana yang berarti…</div>
<div class="q-text">${v.m}</div>`,
      opts:shuffle([{label:`<span class="jp opt-k" style="font-size:22px">${v.w}</span>`,correct:true},
        ...d.map(o=>({label:`<span class="jp opt-k" style="font-size:22px">${o.w}</span>`,correct:false}))])};
  }
  if(type==='r2w'){
    const d=others.filter(o=>o.k!==v.k).slice(0,3);
    return{key:'v:'+v.w,card:v,type,
      prompt:`<div class="q-label">Kanji mana yang dibaca…</div>
<div class="q-text jp">${v.k}</div>
<div class="q-sub">${v.r}</div>`,
      opts:shuffle([{label:`<span class="jp opt-k" style="font-size:22px">${v.w}</span>`,correct:true},
        ...d.map(o=>({label:`<span class="jp opt-k" style="font-size:22px">${o.w}</span>`,correct:false}))])};
  }
  if(type==='w2r'){
    const d=others.filter(o=>o.k!==v.k).slice(0,3);
    return{key:'v:'+v.w,card:v,type,
      prompt:`<div class="q-label">Bagaimana bacaan kata ini?</div>
<div class="q-word jp">${v.w}</div>`,
      opts:shuffle([{label:v.k+' <span class="romaji">'+v.r+'</span>',correct:true},
        ...d.map(o=>({label:o.k+' <span class="romaji">'+o.r+'</span>',correct:false}))])};
  }
  return makeVocabQuestion(v,'w2m');
}

/* ===== BUNPOU QUESTION ===== */
function makeBunpouQuestion(b,type){
  const others=shuffle(BUNPOU.filter(x=>x.p!==b.p));
  if(type==='mixed'){const c=['p2m','m2p'];type=c[Math.floor(Math.random()*2)]}
  if(type==='p2m'){
    const d=others.filter(o=>o.m!==b.m).slice(0,3);
    if(d.length<3)return makeBunpouQuestion(b,'m2p');
    return{key:'b:'+b.p,card:b,type,
      prompt:`<div class="q-label">Apa arti pola ini?</div>
<div class="q-text jp">${b.p}</div>
<div class="q-sub">${b.r}</div>`,
      opts:shuffle([{label:b.m,correct:true},
        ...d.map(o=>({label:o.m,correct:false}))])};
  }
  if(type==='m2p'){
    const d=others.filter(o=>o.m!==b.m).slice(0,3);
    if(d.length<3)return makeBunpouQuestion(b,'p2m');
    return{key:'b:'+b.p,card:b,type,
      prompt:`<div class="q-label">Pola mana yang berarti…</div>
<div class="q-text">${b.m}</div>`,
      opts:shuffle([{label:`<span class="jp" style="font-size:20px">${b.p}</span>`,correct:true},
        ...d.map(o=>({label:`<span class="jp" style="font-size:20px">${o.p}</span>`,correct:false}))])};
  }
  return makeBunpouQuestion(b,'p2m');
}

function makeQuestion(item,type,src){
  if(src==='vocab')return makeVocabQuestion(item,type);
  if(src==='bunpou')return makeBunpouQuestion(item,type);
  return makeKanjiQuestion(item,type);
}

function clearTimer(){if(S.quiz&&S.quiz.timerId){clearInterval(S.quiz.timerId);S.quiz.timerId=null}}

function newQuiz(){clearTimer();
const cfg=S.quizConfig;const p=getQuizPool();let items=[];
if(p.length){const target=cfg.count==='all'?p.length:cfg.count;
while(items.length<target)items=items.concat(shuffle(p));
items=items.slice(0,target)}
S.quiz={items,i:0,right:0,missed:[],q:null,locked:false,timerId:null,timeLeft:0};
nextQuestion()}
function nextQuestion(){const q=S.quiz;
if(!q||q.i>=q.items.length){if(q)q.q=null;return}
const item=q.items[q.i];let type=S.quizConfig.type;
if(type==='mixed'){type='mixed'}
q.q=makeQuestion(item,type,S.quizConfig.source||'kanji');q.locked=false}

function startTimer(){clearTimer();const q=S.quiz;const secs=S.quizConfig.timer;
if(!q||!secs)return;q.timeLeft=secs;
const bar=document.getElementById('timerBar');if(bar)bar.style.width='100%';
q.timerId=setInterval(()=>{q.timeLeft-=0.05;
const b=document.getElementById('timerBar');
if(b)b.style.width=Math.max(0,(q.timeLeft/secs)*100)+'%';
if(q.timeLeft<=0){clearTimer();pick(null)}},50)}

function pick(i){const q=S.quiz;if(!q||q.locked||!q.q)return;
q.locked=true;clearTimer();
const{opts,key}=q.q;
const correct=i!==null&&opts[i]&&opts[i].correct;
if(correct)q.right++;else if(!q.missed.includes(key))q.missed.push(key);
bump(key,correct);
document.querySelectorAll('.opt').forEach((b,j)=>{
if(opts[j].correct)b.classList.add('correct');
else if(j===i)b.classList.add('wrong');
b.disabled=true});
renderStats();
setTimeout(()=>{q.i++;
if(q.i>=q.items.length)renderQuiz();
else{nextQuestion();renderQuiz()}},correct?750:1700)}

function displayForKey(key){
  if(!key)return'';
  if(key.startsWith('v:'))return key.slice(2);
  if(key.startsWith('b:'))return key.slice(2);
  return key;
}

/* ===== SETUP ===== */
function sourceTypeOptions(src){
  if(src==='vocab')return[
    ['mixed','Mixed'],['w2m','Word → Arti'],['m2w','Arti → Word'],['r2w','Kana → Word'],['w2r','Word → Kana']];
  if(src==='bunpou')return[
    ['mixed','Mixed'],['p2m','Pola → Arti'],['m2p','Arti → Pola']];
  return[
    ['mixed','Mixed'],['kanji2mean','Kanji → Meaning'],['mean2kanji','Meaning → Kanji'],['reading','Kanji → Reading'],['vocab','Vocabulary']];
}
function sourceLabel(src){
  return src==='vocab'?'Kosakata':src==='bunpou'?'Bunpou':'Kanji';
}
function poolLabel(src){
  return src==='vocab'?'Kosakata pool':src==='bunpou'?'Bunpou pool':'Kanji pool';
}

    b.onclick=()=>{S.dictCat=b.dataset.c;renderDict()}})}

function renderStats(){const el=document.getElementById('stats');
const items=pool();
const seen=items.filter(c=>store.progress[c.k]).length;
const known=items.filter(c=>boxOf(c.k)>=4).length;
const total=store.stats.right+store.stats.wrong;
const acc=total?Math.round((store.stats.right/total)*100):0;
el.innerHTML=`
<span class="stat">Seen <b>${seen}/${items.length}</b></span>
<span class="stat">Mastered <b>${known}</b></span>
<span class="stat">Accuracy <b>${acc}%</b></span>`}

function render(){
  if(S.mode==='cards')renderCards();
  else if(S.mode==='quiz')renderQuiz();
  else if(S.mode==='bunpou')renderBunpou();
  else if(S.mode==='phrases')renderPhrases();
  else if(S.mode==='dict')renderDict();
  else renderList();
  renderStats()}

document.getElementById('tabs').addEventListener('click',e=>{
const b=e.target.closest('button');if(!b)return;
S.mode=b.dataset.mode;
document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));
if(S.mode==='cards')newDeck();
render()});

document.getElementById('levels').addEventListener('click',e=>{
const b=e.target.closest('button');if(!b)return;
S.level=b.dataset.level;
document.querySelectorAll('#levels button').forEach(x=>x.classList.toggle('on',x===b));
clearTimer();S.quiz=null;
if(S.mode==='cards')newDeck();
render()});

document.addEventListener('keydown',e=>{
if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
if(S.mode==='cards'){
if(S.idx>=S.queue.length)return;
if(e.code==='Space'){e.preventDefault();
S.flipped=!S.flipped;
const fc=document.getElementById('fc');
if(fc)fc.classList.toggle('flipped',S.flipped)}
else if(e.key==='ArrowLeft')answer(false);
else if(e.key==='ArrowRight')answer(true)}
else if(S.mode==='quiz'&&S.quiz&&S.quiz.q){
const n=parseInt(e.key,10);
if(n>=1&&n<=4){const b=document.querySelectorAll('.opt')[n-1];
if(b&&!b.disabled)b.click()}}});

newDeck();
render();
</script>
</body>
</html>
